<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扒螺蛳 · 90行业资金流向看板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:#f0f2f5;color:#333;padding:16px;min-height:100vh}
.container{max-width:1200px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding:12px 16px;background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.header-left h1{font-size:18px;color:#1a1a2e;display:flex;align-items:center;gap:8px}
.header-left h1 span.logo{font-size:22px}
.header-right{text-align:right;font-size:12px;color:#888}
.header-right .date{font-size:14px;color:#333;font-weight:600}
.header-right .market-brief{margin-top:2px}
.header-right .market-brief .up{color:#e74c3c}
.header-right .market-brief .down{color:#27ae60}
.ai-review{background:#f8f9fa;border-radius:12px;padding:14px 18px;margin-bottom:16px;font-size:13px;line-height:1.8;border:1px solid #e9ecef}
.ai-review .title{font-size:13px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px;color:#555}
.ai-review .hl{font-weight:600}
.ai-review .hl-red{color:#e74c3c;font-weight:600}
.ai-review .hl-green{color:#27ae60;font-weight:600}
.ai-review .hl-gold{color:#d4a017;font-weight:600}
.ai-review .stag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;margin:0 2px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.card{background:#fff;border-radius:12px;padding:16px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card .label{font-size:12px;color:#888;margin-bottom:6px}
.card .value{font-size:26px;font-weight:700;line-height:1.2}
.card .value.red{color:#e74c3c}
.card .value.green{color:#27ae60}
.card .value.blue{color:#2980b9}
.card .sub{font-size:11px;color:#aaa;margin-top:4px}
.card .sub .arrow{font-weight:700}
.modules{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.module{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;transition:box-shadow .2s,border-color .2s;border:2px solid transparent}
.module:hover{box-shadow:0 4px 12px rgba(0,0,0,.12);border-color:rgba(52,152,219,.2)}
.module-title{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.module-title .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.module-title .count{margin-left:auto;font-size:11px;color:#aaa;font-weight:400}
.module-item{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12px;border-bottom:1px solid #f8f8f8}
.module-item:last-child{border:none}
.module-item .name{font-weight:500;display:flex;align-items:center;gap:4px}
.module-item .right{display:flex;align-items:center;gap:6px}
.module-item .val{font-weight:600;font-size:12px}
.module-item .val.pos{color:#e74c3c}
.module-item .val.neg{color:#27ae60}
.module-more{font-size:11px;color:#3498db;text-align:center;margin-top:8px;cursor:pointer}
.module-more:hover{text-decoration:underline}
.table-section{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:20px;overflow-x:auto}
.table-section h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.table-section h3 .count-badge{background:#f0f2f5;color:#666;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:400}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#f8f9fa;padding:8px 6px;text-align:left;font-weight:600;color:#666;border-bottom:2px solid #e9ecef;white-space:nowrap}
td{padding:7px 6px;border-bottom:1px solid #f0f0f0;white-space:nowrap}
tr:hover{background:#fafbfc}
tr.clickable{cursor:pointer}
.rank{color:#aaa;font-size:11px;width:30px;text-align:center}
.sector-name{font-weight:600}
.net-val{font-weight:700}
.pos{color:#e74c3c}
.neg{color:#27ae60}
.tag{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600}
.tag-none{color:#ccc;font-size:10px}
.marginal-tag{display:inline-flex;align-items:center;gap:2px;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600}
.signal{padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600}
.signal-neutral{color:#ccc}
.score{display:inline-block;background:#f0f2f5;padding:2px 6px;border-radius:4px;font-weight:600;font-size:11px}
.consec{font-size:10px;font-weight:500}
.consec.pos{color:#e74c3c}
.consec.neg{color:#27ae60}
.leader-name{color:#555;font-size:11px}
.loading{text-align:center;padding:80px 20px;color:#888;font-size:14px}
.loading .spinner{display:inline-block;width:24px;height:24px;border:3px solid #e0e0e0;border-top-color:#3498db;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.error-msg{text-align:center;padding:60px 20px;color:#e74c3c;font-size:14px}
.drawer-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.3);z-index:1000}
.drawer{position:fixed;top:0;right:0;width:440px;max-width:95vw;height:100%;background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.15);z-index:1001;overflow-y:auto;padding:20px;transform:translateX(100%);transition:transform .3s ease}
.drawer.open{transform:translateX(0)}
.drawer-close{position:absolute;top:12px;right:12px;width:28px;height:28px;border:none;background:#f0f0f0;border-radius:50%;cursor:pointer;font-size:16px;line-height:28px;text-align:center}
.drawer-close:hover{background:#ddd}
.drawer h2{font-size:18px;margin-bottom:16px;padding-right:36px;display:flex;align-items:center;gap:8px}
.drawer h2 .d-tag{font-size:12px}
.drawer-section{margin-bottom:18px}
.drawer-section h4{font-size:13px;color:#888;margin-bottom:8px;border-bottom:1px solid #eee;padding-bottom:4px;display:flex;align-items:center;gap:6px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12px}
.info-item{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #fafafa}
.info-item .lbl{color:#888}
.info-item .val{font-weight:600}
.bar-chart{display:flex;align-items:stretch;gap:2px;height:160px;position:relative;padding:24px 0 28px 0;margin:8px 0}
.bar-chart .zero-line{position:absolute;left:0;right:0;top:50%;border-top:1.5px dashed #aaa;z-index:1}
.bar-chart .axis-label{position:absolute;font-size:9px;color:#aaa;z-index:2}
.bar-chart .axis-label.top{top:14px;left:2px}
.bar-chart .axis-label.mid{top:calc(50% - 7px);left:2px}
.bar-chart .axis-label.bot{bottom:18px;left:2px}
.bar-wrapper{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;height:100%}
.bar{width:75%;min-width:8px;position:absolute;transition:height .3s;border-radius:2px}
.bar.positive{background:linear-gradient(to top,#e74c3c,#ff8a8a);border-radius:2px 2px 0 0}
.bar.negative{background:linear-gradient(to bottom,#27ae60,#81c784);border-radius:0 0 2px 2px}
.bar-label{position:absolute;bottom:-18px;font-size:9px;color:#888;white-space:nowrap}
.bar-value{position:absolute;font-size:8px;font-weight:600;white-space:nowrap}
.bar-value.pos{color:#e74c3c}
.bar-value.neg{color:#27ae60}
.time-table{width:100%;font-size:11px;border-collapse:collapse}
.time-table th{background:#f8f9fa;padding:6px 4px;font-size:11px;text-align:center}
.time-table td{padding:5px 4px;text-align:center}
.drawer-table{width:100%;font-size:12px;border-collapse:collapse}
.drawer-table th{background:#f8f9fa;padding:6px;font-size:11px;text-align:left;position:sticky;top:0}
.drawer-table td{padding:5px 6px;border-bottom:1px solid #f5f5f5}
.drawer-table tr:hover{background:#fafbfc}
@media(max-width:768px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .modules{grid-template-columns:1fr 1fr}
  .drawer{width:100%}
  .header{flex-direction:column;align-items:flex-start;gap:8px}
}
</style>
</head>
<body>
<div class="container">
  <div id="app">
    <div class="loading"><span class="spinner"></span>加载数据中...</div>
  </div>
</div>

<div class="drawer-overlay" id="moduleOverlay" onclick="closeAllDrawers()"></div>
<div class="drawer" id="moduleDrawer">
  <button class="drawer-close" onclick="closeAllDrawers()">&#10005;</button>
  <h2 id="moduleDrawerTitle">板块列表</h2>
  <div id="moduleDrawerContent"></div>
</div>

<div class="drawer-overlay" id="detailOverlay" onclick="closeAllDrawers()"></div>
<div class="drawer" id="detailDrawer">
  <button class="drawer-close" onclick="closeAllDrawers()">&#10005;</button>
  <h2 id="detailTitle">板块详情</h2>
  <div class="drawer-section">
    <h4>📋 基本信息</h4>
    <div class="info-grid" id="detailBasic"></div>
  </div>
  <div class="drawer-section">
    <h4>💰 当日资金</h4>
    <div class="info-grid" id="detailFund"></div>
  </div>
  <div class="drawer-section">
    <h4>📈 历史净流入走势（0轴）</h4>
    <div class="bar-chart" id="detailChart"></div>
  </div>
  <div class="drawer-section">
    <h4>⏱️ 当日分时段节奏</h4>
    <table class="time-table" id="detailTimeTable">
      <thead><tr><th>时段</th><th>净流入(亿)</th><th>时段增量(亿)</th><th>边际</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
let DATA = null;
let CURRENT_DATE = null;
let SECTORS = [];
let MARKET = null;
let SIGNALS = null;
let INTRADAY_CHANGES = null;

async function init() {
  try {
    const resp = await fetch('data/fund_data_frontend.json');
    if (!resp.ok) throw new Error('数据加载失败: ' + resp.status);
    DATA = await resp.json();
    
    const dates = DATA.dates;
    CURRENT_DATE = dates[dates.length - 1];
    SECTORS = DATA.sectorsByDate[CURRENT_DATE] || [];
    MARKET = DATA.marketOverview[CURRENT_DATE] || {};
    SIGNALS = DATA.signals[CURRENT_DATE] || {};
    INTRADAY_CHANGES = DATA.intradayChanges || null;
    
    render();
  } catch (e) {
    document.getElementById('app').innerHTML = '<div class="error-msg">⚠️ ' + e.message + '<br><small>请确认 fund_data_frontend.json 文件存在且可访问</small></div>';
  }
}

function fmtNum(v, decimals) {
  if (decimals === undefined) decimals = 2;
  return v.toFixed(decimals);
}

function fmtFlow(v) {
  const prefix = v >= 0 ? '+' : '';
  return prefix + v.toFixed(2) + '亿';
}

function fmtFlowAbs(v) {
  return v.toFixed(1) + '亿';
}

function getSignalHtml(signal) {
  if (signal === 'main_line') return '<span class="signal" style="background:#ffebee;color:#cc0000">主线确认</span>';
  if (signal === 'latent') return '<span class="signal" style="background:#e8f5e9;color:#2e7d32">潜伏机会</span>';
  if (signal === 'disaster') return '<span class="signal" style="background:#e8f5e9;color:#2e7d32">砸盘重灾</span>';
  if (signal === 'risk') return '<span class="signal" style="background:#fff8e0;color:#ff9800">风险预警</span>';
  return '<span class="signal-neutral">--</span>';
}

function getSignalLabel(signal) {
  if (signal === 'main_line') return '主线确认';
  if (signal === 'latent') return '潜伏机会';
  if (signal === 'disaster') return '砸盘重灾';
  if (signal === 'risk') return '风险预警';
  return '';
}

function getWatchTagHtml(s) {
  if (s.watchTag && s.watchTagLabel) {
    return '<span class="tag" style="background:' + s.watchTagBg + ';color:' + s.watchTagColor + '">' + s.watchTag + ' ' + s.watchTagLabel + '</span>';
  }
  if (s.watchTag) {
    return '<span class="tag" style="background:' + s.watchTagBg + ';color:' + s.watchTagColor + '">' + s.watchTag + '</span>';
  }
  return '<span class="tag-none">—</span>';
}

function getMarginalHtml(s) {
  if (s.marginalTag && s.marginalLabel) {
    return '<span class="marginal-tag" style="background:' + s.marginalBg + ';color:' + s.marginalColor + '">' + s.marginalTag + ' ' + s.marginalLabel + '</span>';
  }
  if (s.marginalTag) {
    return '<span class="marginal-tag" style="background:' + s.marginalBg + ';color:' + s.marginalColor + '">' + s.marginalTag + '</span>';
  }
  return '<span class="tag-none">—</span>';
}

function getConsecHtml(s) {
  if (s.consecutiveInDays > 0) {
    return '<span class="consec pos">入' + s.consecutiveInDays + '天</span>';
  }
  if (s.consecutiveOutDays > 0) {
    return '<span class="consec neg">出' + s.consecutiveOutDays + '天</span>';
  }
  return '<span class="tag-none">—</span>';
}

function getDayOfWeek(dateStr) {
  const days = ['日','一','二','三','四','五','六'];
  const d = new Date(dateStr);
  return '周' + days[d.getDay()];
}

function render() {
  const meta = DATA.metaByDate[CURRENT_DATE] || {};
  const typeLabel = meta.type || '';
  const collectTime = meta.collectTime || '';
  const timeStr = collectTime ? collectTime.slice(0,2) + ':' + collectTime.slice(2) : '';
  
  // Market overview
  const m = MARKET;
  const totalStocks = m.totalStocks || 0;
  const totalRise = m.totalRise || 0;
  const totalFall = m.totalFall || 0;
  const risePct = m.risePct || 0;
  const sectorUp = m.sectorUp || 0;
  const sectorDown = m.sectorDown || 0;
  const topSector = m.topSector || '';
  const topSectorChange = m.topSectorChange || 0;
  const totalFlowIn = m.totalFlowIn || 0;
  const totalFlowOut = m.totalFlowOut || 0;
  const netFlow = m.netFlow || 0;
  
  // Index info
  let indexHtml = '';
  if (m.indices && m.indices.length > 0) {
    const idx = m.indices[0];
    const idxCls = idx.change >= 0 ? 'up' : 'down';
    const idxSign = idx.change >= 0 ? '+' : '';
    indexHtml = idx.name + ' <span class="' + idxCls + '">' + idxSign + idx.change.toFixed(2) + '%</span>';
  }
  
  // Intraday change calculation
  let flowInChange = 0, flowOutChange = 0, netChange = 0;
  if (INTRADAY_CHANGES && INTRADAY_CHANGES.totalChange !== undefined) {
    netChange = INTRADAY_CHANGES.totalChange;
  }
  
  // Strongest sector
  const sorted = [...SECTORS].sort((a, b) => b.score - a.score);
  const strongest = sorted.length > 0 ? sorted[0] : null;
  
  // Date display
  const dateDisplay = CURRENT_DATE + ' ' + getDayOfWeek(CURRENT_DATE) + ' ' + typeLabel;
  const timeDisplay = timeStr ? ' · 采集 ' + timeStr : '';
  
  // Market brief
  let briefHtml = '';
  briefHtml += '上涨 <span class="up">' + totalRise + '</span> / 下跌 <span class="down">' + totalFall + '</span>';
  briefHtml += ' · 板块 <span class="up">' + sectorUp + '↑</span> / <span class="down">' + sectorDown + '↓</span>';
  if (indexHtml) briefHtml += ' · ' + indexHtml;
  
  let html = '';
  
  // Header
  html += '<div class="header">';
  html += '<div class="header-left"><h1><span class="logo">📊</span> 扒螺蛳 · 90行业资金流向看板</h1></div>';
  html += '<div class="header-right"><div class="date">' + dateDisplay + timeDisplay + '</div>';
  html += '<div class="market-brief">' + briefHtml + '</div></div></div>';
  
  // Cards (Layer 1)
  const netCls = netFlow >= 0 ? 'red' : 'green';
  const netLabel = netFlow >= 0 ? '主力净流入' : '主力净流出';
  const netChangeDesc = netChange >= 0 ? '改善' : '恶化';
  const netChangeColor = netChange >= 0 ? 'good' : 'bad';
  
  html += '<div class="cards">';
  html += '<div class="card"><div class="label">主力总流入</div>';
  html += '<div class="value red">' + fmtFlowAbs(totalFlowIn) + '</div>';
  html += '<div class="sub">较上时段 <span class="arrow good">↑' + Math.abs(flowInChange).toFixed(1) + '亿</span></div></div>';
  
  html += '<div class="card"><div class="label">主力总流出</div>';
  html += '<div class="value green">' + fmtFlowAbs(totalFlowOut) + '</div>';
  html += '<div class="sub">较上时段 <span class="arrow bad">↑' + Math.abs(flowOutChange).toFixed(1) + '亿</span></div></div>';
  
  html += '<div class="card"><div class="label">' + netLabel + '</div>';
  html += '<div class="value ' + netCls + '">' + Math.abs(netFlow).toFixed(1) + '<span style="font-size:14px;color:#aaa">亿</span></div>';
  html += '<div class="sub">较上时段 <span class="arrow ' + netChangeColor + '">' + netChangeDesc + Math.abs(netChange).toFixed(1) + '亿</span></div></div>';
  
  html += '<div class="card"><div class="label">🏆 最强板块</div>';
  if (strongest) {
    html += '<div class="value blue" style="font-size:20px">' + strongest.name + '</div>';
    html += '<div class="sub">' + strongest.score.toFixed(1) + '分 · 净流入' + strongest.inflow.toFixed(1) + '亿 · ' + (strongest.change >= 0 ? '+' : '') + strongest.change.toFixed(2) + '%</div>';
  } else {
    html += '<div class="value blue" style="font-size:20px">--</div>';
  }
  html += '</div></div>';
  
  // AI Quick Review (Layer 2)
  html += renderAiReview();
  
  // Modules (Layer 3)
  html += renderModules();
  
  // Table
  html += renderTable();
  
  document.getElementById('app').innerHTML = html;
}

function renderAiReview() {
  const m = MARKET;
  if (!m) return '';
  
  const netFlow = m.netFlow || 0;
  const netFlowStr = Math.abs(netFlow).toFixed(0);
  const netDir = netFlow >= 0 ? '净流入' : '净流出';
  const netColorCls = netFlow >= 0 ? 'hl-red' : 'hl-green';
  
  // Net change description
  let changeDesc = '';
  if (INTRADAY_CHANGES && INTRADAY_CHANGES.totalChange !== undefined) {
    const tc = INTRADAY_CHANGES.totalChange;
    if (tc > 0) changeDesc = '，较上时段<span class="hl-red">改善' + tc.toFixed(0) + '亿</span>';
    else if (tc < 0) changeDesc = '，较上时段<span class="hl-green">恶化' + Math.abs(tc).toFixed(0) + '亿</span>';
  }
  
  // Signal counts
  const mainLine = (SIGNALS.mainLine || []);
  const latent = (SIGNALS.latent || []);
  const disaster = (SIGNALS.disaster || []);
  const risk = (SIGNALS.risk || []);
  
  // Top sectors by signal
  let signalTags = '';
  if (mainLine.length > 0) signalTags += '<span class="stag" style="background:#ffebee;color:#cc0000">🔴 主线确认 ' + mainLine.length + '个</span>';
  if (latent.length > 0) signalTags += '<span class="stag" style="background:#e8f5e9;color:#2e7d32">🟢 潜伏机会 ' + latent.length + '个</span>';
  if (disaster.length > 0) signalTags += '<span class="stag" style="background:#e8f5e9;color:#2e7d32">🟢 砸盘重灾 ' + disaster.length + '个</span>';
  if (risk.length > 0) signalTags += '<span class="stag" style="background:#fff8e0;color:#ff9800">🟡 风险预警 ' + risk.length + '个</span>';
  
  // Strongest sector name
  const sorted = [...SECTORS].sort((a, b) => b.score - a.score);
  const topName = sorted.length > 0 ? sorted[0].name : '';
  
  // Consecutive sectors
  const consecIn = SECTORS.filter(s => s.consecutiveInDays >= 2);
  const consecOut = SECTORS.filter(s => s.consecutiveOutDays >= 2);
  let consecDesc = '';
  if (consecIn.length > 0) {
    consecDesc += '<span class="hl-red">' + consecIn.map(s => s.name).slice(0, 3).join('、') + '</span>连续流入';
  }
  if (consecOut.length > 0) {
    if (consecDesc) consecDesc += '，';
    consecDesc += '<span class="hl-green">' + consecOut.map(s => s.name).slice(0, 3).join('、') + '</span>连续流出';
  }
  
  // Market brief
  const riseCount = m.totalRise || 0;
  const fallCount = m.totalFall || 0;
  const risePct = m.risePct || 0;
  
  let patternDesc = '';
  if (risePct > 60) patternDesc = '市场普涨格局，' + riseCount + '家上涨';
  else if (risePct < 40) patternDesc = '市场普跌格局，' + fallCount + '家下跌';
  else patternDesc = '涨跌分化，上涨' + riseCount + '家/下跌' + fallCount + '家';
  
  const dateShort = CURRENT_DATE.slice(5).replace('-', '/');
  
  let text = dateShort + '全市场主力<span class="' + netColorCls + '">' + netDir + netFlowStr + '亿</span>' + changeDesc + '。';
  text += patternDesc + '。';
  if (topName) text += '<span class="hl-gold">' + topName + '</span>综合评分最高（' + sorted[0].score.toFixed(1) + '分）。';
  text += '信号区：' + signalTags;
  if (consecDesc) text += ' ' + consecDesc + '。';
  
  let html = '<div class="ai-review"><div class="title">🧠 AI 盘面速评</div><div>' + text + '</div></div>';
  return html;
}

function renderModules() {
  const mainLine = SIGNALS.mainLine || [];
  const disaster = SIGNALS.disaster || [];
  const consecIn = SECTORS.filter(s => s.consecutiveInDays >= 2).sort((a, b) => b.consecutiveInDays - a.consecutiveInDays);
  const consecOut = SECTORS.filter(s => s.consecutiveOutDays >= 2).sort((a, b) => b.consecutiveOutDays - a.consecutiveOutDays);
  
  function renderModuleItem(s, isOut) {
    const valCls = s.inflow >= 0 ? 'pos' : 'neg';
    const valStr = s.inflow >= 0 ? '+' + s.inflow.toFixed(1) + '亿' : s.inflow.toFixed(1) + '亿';
    const watchHtml = s.watchTag ? ' <span style="font-size:10px">' + s.watchTag + '</span>' : '';
    const marginalHtml = s.marginalTag ? ' <span class="marginal-tag" style="background:' + s.marginalBg + ';color:' + s.marginalColor + ';font-size:10px">' + s.marginalTag + '</span>' : '';
    return '<div class="module-item"><span class="name">' + s.name + watchHtml + '</span><span class="right"><span class="val ' + valCls + '">' + valStr + '</span>' + marginalHtml + '</span></div>';
  }
  
  function renderConsecItem(s) {
    const days = s.consecutiveInDays > 0 ? s.consecutiveInDays : s.consecutiveOutDays;
    const prefix = s.consecutiveInDays > 0 ? '+' : '-';
    const valCls = s.consecutiveInDays > 0 ? 'pos' : 'neg';
    const marginalHtml = s.marginalTag ? ' <span class="marginal-tag" style="background:' + s.marginalBg + ';color:' + s.marginalColor + ';font-size:10px">' + s.marginalTag + '</span>' : '';
    return '<div class="module-item"><span class="name">' + s.name + '</span><span class="right"><span class="val ' + valCls + '">' + prefix + days + '天</span>' + marginalHtml + '</span></div>';
  }
  
  let html = '<div class="modules">';
  
  // Module 1: Buying
  html += '<div class="module" onclick="openModuleDrawer(\'inflow\')">';
  html += '<div class="module-title"><span class="dot" style="background:#e74c3c"></span>主力在买<span class="count">' + mainLine.length + '个</span></div>';
  if (mainLine.length === 0) {
    html += '<div class="module-item" style="color:#aaa;justify-content:center;font-style:italic">暂无数据</div>';
  } else {
    mainLine.slice(0, 5).forEach(s => { html += renderModuleItem(s, false); });
  }
  html += '<div class="module-more">查看更多 ›</div></div>';
  
  // Module 2: Selling (disaster)
  html += '<div class="module" onclick="openModuleDrawer(\'outflow\')">';
  html += '<div class="module-title"><span class="dot" style="background:#27ae60"></span>主力在卖<span class="count">' + disaster.length + '个</span></div>';
  if (disaster.length === 0) {
    html += '<div class="module-item" style="color:#aaa;justify-content:center;font-style:italic">暂无数据</div>';
  } else {
    disaster.slice(0, 5).forEach(s => { html += renderModuleItem(s, true); });
  }
  html += '<div class="module-more">查看更多 ›</div></div>';
  
  // Module 3: Consecutive In
  html += '<div class="module" onclick="openModuleDrawer(\'consec_in\')">';
  html += '<div class="module-title"><span class="dot" style="background:#e67e22"></span>连入板块<span class="count">' + consecIn.length + '个</span></div>';
  if (consecIn.length === 0) {
    html += '<div class="module-item" style="color:#aaa;justify-content:center;font-style:italic">暂无数据</div>';
  } else {
    consecIn.slice(0, 5).forEach(s => { html += renderConsecItem(s); });
  }
  html += '<div class="module-more">查看更多 ›</div></div>';
  
  // Module 4: Consecutive Out
  html += '<div class="module" onclick="openModuleDrawer(\'consec_out\')">';
  html += '<div class="module-title"><span class="dot" style="background:#95a5a6"></span>连出板块<span class="count">' + consecOut.length + '个</span></div>';
  if (consecOut.length === 0) {
    html += '<div class="module-item" style="color:#aaa;justify-content:center;font-style:italic">暂无数据</div>';
  } else {
    consecOut.slice(0, 5).forEach(s => { html += renderConsecItem(s); });
  }
  html += '<div class="module-more">查看更多 ›</div></div>';
  
  html += '</div>';
  return html;
}

function renderTable() {
  const sorted = [...SECTORS].sort((a, b) => b.inflow - a.inflow);
  const count = sorted.length;
  
  let html = '<div class="table-section">';
  html += '<h3>90行业资金排行 <span class="count-badge">' + count + '个行业</span></h3>';
  html += '<table><thead><tr>';
  html += '<th>#</th><th>板块</th><th>关注</th><th>边际</th><th>净流入</th><th>涨跌幅</th><th>信号区</th><th>评分</th><th>龙头</th><th>连续</th>';
  html += '</tr></thead><tbody>';
  
  sorted.forEach((s, i) => {
    const netCls = s.inflow >= 0 ? 'pos' : 'neg';
    const netStr = s.inflow >= 0 ? '+' + s.inflow.toFixed(2) + '亿' : s.inflow.toFixed(2) + '亿';
    const chgCls = s.change >= 0 ? 'pos' : 'neg';
    const chgStr = (s.change >= 0 ? '+' : '') + s.change.toFixed(2) + '%';
    
    html += '<tr class="clickable" onclick="openDetailDrawer(' + i + ')">';
    html += '<td class="rank">' + (i + 1) + '</td>';
    html += '<td class="sector-name">' + s.name + '</td>';
    html += '<td>' + getWatchTagHtml(s) + '</td>';
    html += '<td>' + getMarginalHtml(s) + '</td>';
    html += '<td class="' + netCls + ' net-val">' + netStr + '</td>';
    html += '<td class="' + chgCls + '">' + chgStr + '</td>';
    html += '<td>' + getSignalHtml(s.signal) + '</td>';
    html += '<td><span class="score">' + (s.score ? s.score.toFixed(1) : '--') + '</span></td>';
    html += '<td><span class="leader-name">' + (s.leader || '--') + '</span> <span class="' + (s.leaderChange >= 0 ? 'pos' : 'neg') + '">' + (s.leaderChange >= 0 ? '+' : '') + s.leaderChange.toFixed(1) + '%</span></td>';
    html += '<td>' + getConsecHtml(s) + '</td>';
    html += '</tr>';
  });
  
  html += '</tbody></table></div>';
  return html;
}

// Drawer logic
function openModuleDrawer(type) {
  const overlay = document.getElementById('moduleOverlay');
  const drawer = document.getElementById('moduleDrawer');
  const title = document.getElementById('moduleDrawerTitle');
  const content = document.getElementById('moduleDrawerContent');
  
  let list = [];
  if (type === 'inflow') {
    title.textContent = '🔥 主力在买 · 主线确认板块';
    list = (SIGNALS.mainLine || []).map(s => {
      const full = SECTORS.find(fs => fs.name === s.name);
      return full || s;
    });
    // Also include all sectors with positive inflow sorted by inflow desc
    const allInflow = SECTORS.filter(s => s.inflow > 0).sort((a, b) => b.inflow - a.inflow);
    list = allInflow;
  } else if (type === 'outflow') {
    title.textContent = '💀 主力在卖 · 砸盘重灾板块';
    const allOutflow = SECTORS.filter(s => s.inflow <= 0).sort((a, b) => a.inflow - b.inflow);
    list = allOutflow;
  } else if (type === 'consec_in') {
    title.textContent = '📈 连续流入板块';
    list = SECTORS.filter(s => s.consecutiveInDays >= 2).sort((a, b) => b.consecutiveInDays - a.consecutiveInDays);
  } else if (type === 'consec_out') {
    title.textContent = '📉 连续流出板块';
    list = SECTORS.filter(s => s.consecutiveOutDays >= 2).sort((a, b) => b.consecutiveOutDays - a.consecutiveOutDays);
  }
  
  let html = '<table class="drawer-table"><thead><tr><th>#</th><th>板块</th><th>关注</th><th>边际</th><th>净流入</th><th>涨跌</th><th>信号区</th></tr></thead><tbody>';
  list.forEach((s, i) => {
    const netCls = s.inflow > 0 ? 'pos' : 'neg';
    const netStr = s.inflow >= 0 ? '+' + s.inflow.toFixed(2) + '亿' : s.inflow.toFixed(2) + '亿';
    const chgCls = s.change > 0 ? 'pos' : s.change < 0 ? 'neg' : '';
    const chgStr = (s.change >= 0 ? '+' : '') + s.change.toFixed(2) + '%';
    
    html += '<tr><td>' + (i + 1) + '</td>';
    html += '<td style="font-weight:600">' + s.name + '</td>';
    html += '<td>' + getWatchTagHtml(s) + '</td>';
    html += '<td>' + getMarginalHtml(s) + '</td>';
    html += '<td class="' + netCls + '" style="font-weight:600">' + netStr + '</td>';
    html += '<td class="' + chgCls + '">' + chgStr + '</td>';
    html += '<td>' + getSignalHtml(s.signal) + '</td></tr>';
  });
  html += '</tbody></table>';
  if (list.length === 0) html = '<div style="text-align:center;color:#aaa;padding:40px;font-style:italic">暂无数据</div>';
  content.innerHTML = html;
  
  overlay.style.display = 'block';
  setTimeout(() => drawer.classList.add('open'), 10);
}

function buildChart(containerId, history) {
  const container = document.getElementById(containerId);
  if (!history || history.length === 0) {
    container.innerHTML = '<div style="color:#aaa;text-align:center;width:100%;padding:20px">暂无历史数据</div>';
    return;
  }
  const maxAbs = Math.max(...history.map(h => Math.abs(h.inflow)), 0.01);
  let html = '<div class="zero-line"></div>';
  html += '<span class="axis-label top">流入 ↑</span><span class="axis-label mid">— 0 —</span><span class="axis-label bot">流出 ↓</span>';
  history.forEach(h => {
    const val = h.inflow;
    const pct = (Math.abs(val) / maxAbs) * 40;
    const isPos = val >= 0;
    const barCls = isPos ? 'positive' : 'negative';
    const valCls = isPos ? 'pos' : 'neg';
    const valText = val.toFixed(1);
    const dateLabel = h.date ? h.date.slice(5) : '';
    if (isPos) {
      html += '<div class="bar-wrapper"><div class="bar-value ' + valCls + '" style="bottom:calc(50% + ' + pct + '% + 2px)">' + valText + '</div><div class="bar ' + barCls + '" style="height:' + pct + '%;bottom:50%"></div><div class="bar-label">' + dateLabel + '</div></div>';
    } else {
      html += '<div class="bar-wrapper"><div class="bar-value ' + valCls + '" style="top:calc(50% + ' + pct + '% + 2px)">' + valText + '</div><div class="bar ' + barCls + '" style="height:' + pct + '%;top:50%"></div><div class="bar-label">' + dateLabel + '</div></div>';
    }
  });
  container.innerHTML = html;
}

// Store sorted sectors for detail drawer access
let sortedSectors = [];

function openDetailDrawer(idx) {
  if (sortedSectors.length === 0) {
    sortedSectors = [...SECTORS].sort((a, b) => b.inflow - a.inflow);
  }
  const s = sortedSectors[idx];
  if (!s) return;
  
  const overlay = document.getElementById('detailOverlay');
  const drawer = document.getElementById('detailDrawer');
  
  const watchHtml = s.watchTag ? '<span class="tag d-tag" style="background:' + s.watchTagBg + ';color:' + s.watchTagColor + '">' + s.watchTag + '</span>' : '';
  document.getElementById('detailTitle').innerHTML = s.name + ' · 详情 ' + watchHtml;
  
  const sigHtml = getSignalHtml(s.signal);
  const consec = s.consecutiveInDays > 0 ? '<span class="consec pos">连续流入 ' + s.consecutiveInDays + '天</span>' : s.consecutiveOutDays > 0 ? '<span class="consec neg">连续流出 ' + s.consecutiveOutDays + '天</span>' : '—';
  
  document.getElementById('detailBasic').innerHTML =
    '<div class="info-item"><span class="lbl">板块代码</span><span class="val">' + (s.code || '--') + '</span></div>' +
    '<div class="info-item"><span class="lbl">成分股</span><span class="val">' + (s.stockCount || 0) + '只（涨' + (s.riseCount || 0) + '/跌' + (s.fallCount || 0) + '）</span></div>' +
    '<div class="info-item"><span class="lbl">综合评分</span><span class="val">' + (s.score ? s.score.toFixed(1) : '--') + '分</span></div>' +
    '<div class="info-item"><span class="lbl">龙头股</span><span class="val">' + (s.leader || '--') + ' ' + (s.leaderChange ? (s.leaderChange > 0 ? '+' : '') + s.leaderChange.toFixed(2) + '%' : '') + '</span></div>' +
    '<div class="info-item"><span class="lbl">连续</span><span class="val">' + consec + '</span></div>' +
    '<div class="info-item"><span class="lbl">边际变化</span><span class="val">' + getMarginalHtml(s) + '</span></div>';
  
  const netColor = s.inflow >= 0 ? '#e74c3c' : '#27ae60';
  const chgColor = s.change >= 0 ? '#e74c3c' : '#27ae60';
  document.getElementById('detailFund').innerHTML =
    '<div class="info-item"><span class="lbl">主力流入</span><span class="val" style="color:#e74c3c">' + (s.flowIn ? s.flowIn.toFixed(2) + '亿' : '--') + '</span></div>' +
    '<div class="info-item"><span class="lbl">主力流出</span><span class="val" style="color:#27ae60">' + (s.flowOut ? s.flowOut.toFixed(2) + '亿' : '--') + '</span></div>' +
    '<div class="info-item"><span class="lbl">净流入</span><span class="val" style="color:' + netColor + '">' + (s.inflow >= 0 ? '+' : '') + s.inflow.toFixed(2) + '亿</span></div>' +
    '<div class="info-item"><span class="lbl">涨跌幅</span><span class="val" style="color:' + chgColor + '">' + (s.change >= 0 ? '+' : '') + s.change.toFixed(2) + '%</span></div>' +
    '<div class="info-item"><span class="lbl">信号区</span><span class="val">' + sigHtml + '</span></div>' +
    '<div class="info-item"><span class="lbl">关注标签</span><span class="val">' + getWatchTagHtml(s) + '</span></div>';
  
  buildChart('detailChart', s.history || []);
  
  // Time table from intraday
  const intraday = s.intraday;
  let timeHtml = '';
  if (intraday && intraday.length > 0) {
    let prevNet = 0;
    intraday.forEach((item, i) => {
      const delta = item.net - prevNet;
      const netCls = item.net >= 0 ? 'pos' : 'neg';
      const deltaCls = delta > 0 ? 'pos' : delta < 0 ? 'neg' : '';
      const tl = item.time.slice(0, 2) + ':' + item.time.slice(2);
      let stepMg = '—';
      if (i > 0) {
        if (delta > 2) stepMg = '<span class="marginal-tag" style="background:#ffebee;color:#cc0000">↑↑ 加速</span>';
        else if (delta > 0) stepMg = '<span class="marginal-tag" style="background:#fff0f0;color:#ff8a8a">↑ 减速</span>';
        else if (delta < -2) stepMg = '<span class="marginal-tag" style="background:#e8f5e9;color:#2e7d32">↓↓ 加速</span>';
        else if (delta < 0) stepMg = '<span class="marginal-tag" style="background:#f0f8f0;color:#81c784">↓ 减速</span>';
        else stepMg = '<span class="marginal-tag" style="background:#fff8e0;color:#ff9800">🔄 持平</span>';
      }
      timeHtml += '<tr><td style="font-weight:500">' + tl + '</td><td class="' + netCls + '" style="font-weight:600">' + item.net.toFixed(2) + '</td><td class="' + deltaCls + '">' + (delta > 0 ? '+' : '') + delta.toFixed(2) + '</td><td>' + stepMg + '</td></tr>';
      prevNet = item.net;
    });
  } else {
    timeHtml = '<tr><td colspan="4" style="color:#aaa;text-align:center">仅有收盘数据</td></tr>';
  }
  document.getElementById('detailTimeTable').querySelector('tbody').innerHTML = timeHtml;
  
  overlay.style.display = 'block';
  setTimeout(() => drawer.classList.add('open'), 10);
}

function closeAllDrawers() {
  document.querySelectorAll('.drawer').forEach(d => d.classList.remove('open'));
  document.querySelectorAll('.drawer-overlay').forEach(o => o.style.display = 'none');
  sortedSectors = [];
}

init();
